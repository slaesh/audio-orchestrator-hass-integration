name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Package and Upload HACS Zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create HACS Zip archive
        run: |
          # HACS extracts zip directly into custom_components/<domain>/, so archive files from inside the domain directory
          cd custom_components/audio_orchestrator
          zip -r ../../audio_orchestrator.zip . -x "*/__pycache__*"
          cd ../..

      - name: Upload zip to release asset
        uses: softprops/action-gh-release@v2
        with:
          files: audio_orchestrator.zip
