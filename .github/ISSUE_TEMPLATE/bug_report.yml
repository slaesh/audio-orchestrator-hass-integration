name: Bug Report
description: Create a report to help us improve the Audio Orchestrator Home Assistant integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please provide as much detail as possible.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      description: What version of Home Assistant Core / OS are you running?
      placeholder: "e.g. 2026.10.2"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      description: What version of Audio Orchestrator HASS integration are you running?
      placeholder: "e.g. 1.0.10"
    validations:
      required: true
  - type: input
    id: server_version
    attributes:
      label: Audio Orchestrator Server Version
      description: Version of your Audio Orchestrator backend server.
      placeholder: "e.g. 0.4.1"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Media Player card...
        2. Select source ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Home Assistant Logs
      description: Please copy and paste relevant logs from Home Assistant (Settings > System > Logs). Redact private tokens/IPs if necessary.
      render: shell
